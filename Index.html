
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Form</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  h3 { margin-bottom: 5px; }
  .section { margin-bottom: 20px; }
  label { display: block; margin: 8px 0 3px; font-size: 14px; }
  input[type="text"], input[type="date"], input[type="tel"], input[type="email"], textarea, select {
    width: 300px; padding: 5px; border: 1px solid #999;
  }
  textarea { height: 50px; }
  .inline { display: inline; margin-right: 10px; }
  hr { margin: 15px 0; }
</style>
</head>
<body>

<h2>Application Form</h2>

<form>
<!-- A. General Information -->
<div class="section">
  <h3>A. General Information</h3>

  <label>Proposed Insured's Full Name *</label>
  <input type="text" name="fullname" required>

  <label>Birth Date * <small>mm/dd/yyyy</small></label>
  <input type="date" name="birthdate" required>

  <label>Gender *</label>
  <div>
    <span class="inline"><input type="radio" name="gender" value="male"> Male</span>
    <span class="inline"><input type="radio" name="gender" value="female"> Female</span>
  </div>

  <label>Address *</label>
  <textarea name="address" required></textarea>

  <label>Phone Number *</label>
  <input type="tel" name="phone" required>

  <label>Email Address *</label>
  <input type="email" name="email" required>

  <label>Social Security / Reference Number</label>
  <input type="text" name="ssn">

  <label>Marital Status *</label>
  <input type="text" name="marital">

  <label>Occupation *</label>
  <input type="text" name="occupation">

  <label>Are You Retired? *</label>
  <div>
    <span class="inline"><input type="radio" name="retired" value="yes"> Yes</span>
    <span class="inline"><input type="radio" name="retired" value="no"> No</span>
  </div>
</div>

<hr>

<!-- B. Type of Health Coverage -->
<div class="section">
  <h3>B. Type of Health Coverage</h3>

  <label><b>Employee Coverage</b></label>
  <div>
    <span class="inline"><input type="radio" name="emp_cov" value="yes"> Yes</span>
    <span class="inline"><input type="radio" name="emp_cov" value="no"> No</span>
  </div>
  <label>Employee Plan Choice: 
    <select name="emp_plan">
      <option>Select Plan</option>
      <option>Basic Plan</option>
      <option>Standard Plan</option>
      <option>Premium Plan</option>
    </select>
  </label>

  <br><br>
  <label><b>Spouse Coverage</b></label>
  <div>
    <span class="inline"><input type="radio" name="spouse_cov" value="yes"> Yes</span>
    <span class="inline"><input type="radio" name="spouse_cov" value="no"> No</span>
  </div>
  <label>Spouse Plan Choice:
    <select name="spouse_plan">
      <option>Select Plan</option>
      <option>Basic Plan</option>
      <option>Standard Plan</option>
      <option>Premium Plan</option>
    </select>
  </label>

  <br><br>
  <label><b>Children Coverage</b></label>
  <div>
    <span class="inline"><input type="radio" name="child_cov" value="yes"> Yes</span>
    <span class="inline"><input type="radio" name="child_cov" value="no"> No</span>
  </div>
  <label>Children Plan Choice:
    <select name="child_plan">
      <option>Select Plan</option>
      <option>Basic Plan</option>
      <option>Standard Plan</option>
      <option>Premium Plan</option>
    </select>
  </label>
</div>

<br>
<input type="submit" value="Submit Application">

</form>
</body>
</html>
